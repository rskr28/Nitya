name: Frontend CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/frontend-journey

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Test lotus and lesson flow
        run: npm run test
      - name: Build production bundle
        run: npm run build
